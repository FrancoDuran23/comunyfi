# Comunyfi en Cloudflare Workers (plan Free, sin tarjeta).
# No pongas el account_id acá. Usá `npx wrangler login` o CLOUDFLARE_ACCOUNT_ID.
name = "comunyfi"
main = "src/worker.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[vars]
PAYOUT_DRY_RUN = "true"

[[durable_objects.bindings]]
name = "COMUNYFI"
class_name = "ComunyfiState"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ComunyfiState"]
